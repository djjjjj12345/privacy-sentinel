<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>隐私哨兵 · 输入守卫</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🛡</span>
      <div>
        <h1>隐私哨兵 · 输入守卫</h1>
        <p>在任意网站输入时实时提醒</p>
      </div>
    </div>
  </header>

  <div class="badge-local">🔒 检测全程在本机完成，原文不上传</div>

  <section>
    <label class="row switch">
      <span>
        <b>启用守卫</b>
        <em>关闭后不再对任何输入框提醒</em>
      </span>
      <input type="checkbox" id="enabled">
    </label>

    <label class="row">
      <span>
        <b>提醒等级阈值</b>
        <em>低于该等级的信息不打扰你</em>
      </span>
      <select id="minLevel">
        <option value="1">L1 及以上（全部提醒）</option>
        <option value="2">L2 及以上（跳过邮箱、姓名）</option>
        <option value="3">L3 及以上（只拦高危）</option>
        <option value="4">L4（只拦验证码类）</option>
      </select>
    </label>

    <label class="row">
      <span>
        <b>默认脱敏方式</b>
        <em>点「一键脱敏」时的处理策略</em>
      </span>
      <select id="strategy">
        <option value="mask">打码（138****8000）</option>
        <option value="label">替换（[手机号]）</option>
        <option value="remove">直接删除</option>
      </select>
    </label>

    <label class="row switch">
      <span>
        <b>本站静音</b>
        <em id="hostName">当前站点</em>
      </span>
      <input type="checkbox" id="muteHost">
    </label>
  </section>

  <section class="stats">
    <div><b id="statAlerted">0</b><span>累计提醒</span></div>
    <div><b id="statMasked">0</b><span>已脱敏</span></div>
  </section>

  <footer>
    <a id="openTool" href="#" target="_blank">打开完整检测工具 →</a>
    <p class="tip">规则与网页版同源，改规则只需改一份引擎。</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
